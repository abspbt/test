  :root{
    --ink:#fff;
    --ink-dim:rgba(255,255,255,.78);
    --glass-bg:rgba(16,15,26,.82);
    --glass-border:rgba(255,255,255,.1);
    --safe-b:env(safe-area-inset-bottom, 0px);
    --safe-t:env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:#17152a;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    color:var(--ink);
    background:#17152a;
    overflow-x:hidden;
  }

  .hero{
    position:relative;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    background:#17152a;
  }
  /* 底圖與遮罩改用 position:fixed 貼齊視窗，避免 Safari 網址列收合／彈跳時
     露出 .hero 本身的底色，造成上下留白 */
  .hero-bg{
    position:fixed;
    inset:0;
    z-index:0;
    background:url("assets/img/home-bg.jpg") center 28% / cover no-repeat;
    pointer-events:none;
  }
  /* 文字可讀性遮罩 */
  .hero-scrim{
    position:fixed;
    inset:0;
    z-index:1;
    background:linear-gradient(180deg, rgba(10,8,20,.62) 0%, rgba(10,8,20,.08) 24%, rgba(10,8,20,.12) 58%, rgba(10,8,20,.76) 100%);
    pointer-events:none;
  }

  header{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:calc(16px + var(--safe-t)) 20px 16px;
  }
  .brand{
    font-family:"Brand LXGW WenKai TC Light","Songti TC","Noto Serif TC","STSong","PMingLiU",serif;
    font-size:15px;
    font-weight:300;
    letter-spacing:.02em;
  }
  .hero-copy{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    text-align:left;
    padding:24px calc(96px + 16px) calc(28px + var(--safe-b)) 28px;
    gap:10px;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--ink-dim);
    animation:rise .7s ease-out both;
  }
  .title{
    font-family:"Brand LXGW WenKai TC Light","Songti TC","Noto Serif TC","STSong","PMingLiU",serif;
    font-weight:300;
    font-size:clamp(32px,9vw,44px);
    line-height:1.2;
    letter-spacing:.06em;
    animation:rise .7s .06s ease-out both;
  }
  .desc{
    max-width:28ch;
    font-size:14px;
    line-height:1.7;
    color:var(--ink-dim);
    animation:rise .7s .12s ease-out both;
  }
  @keyframes rise{
    from{opacity:.01;transform:translateY(14px);}
    to{opacity:1;transform:none;}
  }

  .side-nav{
    position:fixed;
    top:50%;
    right:26px;
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    transform:translateY(-50%);
  }
  .navtab{
    display:flex;
    align-items:baseline;
    justify-content:flex-end;
    gap:10px;
    padding:12px 0;
    -webkit-appearance:none;
    appearance:none;
    background:none;
    background-color:transparent;
    border:none;
    border-top:1px solid rgba(255,255,255,.24);
    border-radius:0;
    color:var(--ink-dim);
    font:inherit;
    font-size:14px;
    letter-spacing:.16em;
    text-align:right;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    text-shadow:0 1px 8px rgba(0,0,0,.5);
    transition:opacity .15s ease, color .15s ease;
  }
  .navtab:first-child{border-top:none;}
  .navtab .idx{
    font-family:"Brand LXGW WenKai TC Light","Songti TC","Noto Serif TC",serif;
    font-size:11px;
    letter-spacing:0;
    opacity:.55;
  }
  .navtab:active{opacity:.6;}
  .navtab.active{color:#f4e3c1;font-weight:600;}
  .navtab.active .idx{opacity:1;color:#f4e3c1;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
    .eyebrow,.title,.desc{opacity:1 !important;transform:none !important;}
    .navtab:active{transform:none;opacity:.6;}
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-bg" aria-hidden="true"></div>
  <div class="hero-scrim" aria-hidden="true"></div>
  <header>
    <span class="brand">歪嘴雞烘焙</span>
  </header>

  <div class="hero-copy">
    <p class="eyebrow">手工烘焙・每日現做</p>
    <h1 class="title">歪嘴雞烘焙</h1>
    <p class="desc">以溫度與時間慢慢等待，每一份貝果、蛋糕與沙拉，都是清晨手作的心意。</p>
  </div>

</div>

<nav class="side-nav">
  <button type="button" class="navtab active"><span class="idx">01</span><span>首頁</span></button>
  <button type="button" class="navtab"><span class="idx">02</span><span>貝果</span></button>
  <button type="button" class="navtab"><span class="idx">03</span><span>蛋糕</span></button>
  <button type="button" class="navtab"><span class="idx">04</span><span>溫沙拉</span></button>
  <button type="button" class="navtab"><span class="idx">05</span><span>關於</span></button>
  <button type="button" class="navtab"><span class="idx">06</span><span>Q&amp;A</span></button>
</nav>

<script>
  // iOS Safari 若無 touch 監聽會延遲甚至跳過 :active，導致點擊回饋變慢
  document.addEventListener('touchstart', function(){}, {passive:true});

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
  }
</script>
