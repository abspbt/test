<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>極簡 PWA App</title>
  <link rel="manifest" href="manifest.json">
  <!-- 網頁版直接引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* iPhone 底部安全區域 */
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }

    #sheet {
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
      touch-action: none;
    }
    #sheet.open { transform: translateY(0); }
    #sheet.dragging { transition: none; }

    #backdrop {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s cubic-bezier(0.32, 0.72, 0, 1);
    }
    #backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 flex items-center justify-center min-h-screen overflow-hidden">

  <div class="text-center p-8 bg-white shadow-xl rounded-2xl max-w-sm w-full">
    <h1 class="text-2xl font-bold mb-4">Hello PWA 👋</h1>
    <p class="text-gray-500 mb-6">極簡模板已準備就緒</p>
    <button id="openBtn"
      class="px-6 py-3 rounded-full bg-gray-900 text-white font-medium active:scale-95 transition-transform">
      打開底部抽屜
    </button>
  </div>

  <!-- Backdrop -->
  <div id="backdrop" class="fixed inset-0 bg-black/40 z-40"></div>

  <!-- Bottom Sheet -->
  <div id="sheet"
    class="fixed left-0 right-0 bottom-0 z-50 bg-white/90 backdrop-blur-md rounded-t-3xl shadow-2xl pb-safe">
    <!-- Drag Handle -->
    <div id="handle" class="pt-3 pb-2 flex justify-center cursor-grab active:cursor-grabbing">
      <div class="w-10 h-1.5 rounded-full bg-gray-300"></div>
    </div>

    <div class="px-6 pb-8 pt-2">
      <h2 class="text-lg font-bold mb-2">底部抽屜</h2>
      <p class="text-gray-500 text-sm leading-relaxed">
        往下拖動抽屜或點擊背景遮罩即可關閉，模擬 vaul 的原生手勢質感。
      </p>
    </div>
  </div>

  <script>
    const sheet = document.getElementById('sheet');
    const backdrop = document.getElementById('backdrop');
    const handle = document.getElementById('handle');
    const openBtn = document.getElementById('openBtn');

    const CLOSE_THRESHOLD = 0.25; // 拖動超過抽屜高度的 25% 即關閉
    const VELOCITY_THRESHOLD = 0.5; // px/ms

    let startY = 0;
    let currentY = 0;
    let dragging = false;
    let startTime = 0;
    let sheetHeight = 0;

    function openSheet() {
      sheet.classList.add('open');
      backdrop.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeSheet() {
      sheet.classList.remove('open');
      backdrop.classList.remove('open');
      document.body.style.overflow = '';
    }

    function onDragStart(clientY) {
      dragging = true;
      startY = clientY;
      currentY = 0;
      startTime = Date.now();
      sheetHeight = sheet.offsetHeight;
      sheet.classList.add('dragging');
    }

    function onDragMove(clientY) {
      if (!dragging) return;
      const delta = clientY - startY;
      currentY = Math.max(0, delta); // 只允許向下拖動
      sheet.style.transform = `translateY(${currentY}px)`;
    }

    function onDragEnd() {
      if (!dragging) return;
      dragging = false;
      sheet.classList.remove('dragging');
      sheet.style.transform = '';

      const elapsed = Math.max(Date.now() - startTime, 1);
      const velocity = currentY / elapsed;

      if (currentY > sheetHeight * CLOSE_THRESHOLD || velocity > VELOCITY_THRESHOLD) {
        closeSheet();
      }
    }

    // Pointer Events(涵蓋觸控與滑鼠)
    handle.addEventListener('pointerdown', (e) => {
      handle.setPointerCapture(e.pointerId);
      onDragStart(e.clientY);
    });
    handle.addEventListener('pointermove', (e) => onDragMove(e.clientY));
    handle.addEventListener('pointerup', onDragEnd);
    handle.addEventListener('pointercancel', onDragEnd);

    openBtn.addEventListener('click', openSheet);
    backdrop.addEventListener('click', closeSheet);

    // 註冊 Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('SW 註冊成功!', reg))
          .catch(err => console.log('SW 註冊失敗', err));
      });
    }
  </script>
</body>
</html>
