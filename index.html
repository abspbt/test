  :root{
    --ink:#fff;
    --ink-dim:rgba(255,255,255,.78);
    --glass-bg:rgba(16,15,26,.82);
    --glass-border:rgba(255,255,255,.1);
    --safe-b:env(safe-area-inset-bottom, 0px);
    --safe-t:env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    color:var(--ink);
    background:#17152a;
    overflow-x:hidden;
  }

  .hero{
    position:relative;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    background:
      radial-gradient(110% 55% at 74% 22%, rgba(255,170,120,.4), transparent 62%),
      linear-gradient(180deg,
        #8f8d9c 0%,
        #b79c9a 16%,
        #eaab84 34%,
        #ee8e63 47%,
        #7a7796 63%,
        #423f5e 78%,
        #201d34 92%,
        #17152a 100%);
  }
  .hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,.28) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%);
    pointer-events:none;
  }

  header{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:calc(16px + var(--safe-t)) 20px 16px;
  }
  .brand{
    font-family:"Brand LXGW WenKai TC Light","Songti TC","Noto Serif TC","STSong","PMingLiU",serif;
    font-size:15px;
    font-weight:300;
    letter-spacing:.02em;
  }
  .hero-copy{
    position:relative;
    z-index:2;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px 28px;
    gap:14px;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--ink-dim);
    animation:rise .7s ease-out both;
  }
  .title{
    font-family:"Brand LXGW WenKai TC Light","Songti TC","Noto Serif TC","STSong","PMingLiU",serif;
    font-weight:300;
    font-size:clamp(40px,11vw,56px);
    line-height:1.2;
    letter-spacing:.06em;
    animation:rise .7s .06s ease-out both;
  }
  .desc{
    max-width:30ch;
    font-size:14px;
    line-height:1.7;
    color:var(--ink-dim);
    animation:rise .7s .12s ease-out both;
  }
  @keyframes rise{
    from{opacity:.01;transform:translateY(14px);}
    to{opacity:1;transform:none;}
  }

  .tabbar{
    position:fixed;
    left:16px;right:16px;
    bottom:calc(16px + var(--safe-b));
    z-index:10;
    display:flex;
    justify-content:space-between;
    padding:10px 6px;
    background:var(--glass-bg);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--glass-border);
    border-radius:16px;
  }
  .tab{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding:6px 2px;
    min-height:44px;
    color:var(--ink-dim);
    background:none;
    border:none;
    font:inherit;
    text-decoration:none;
    transition:transform .15s cubic-bezier(.4,0,.2,1), opacity .15s ease;
  }
  .tab:active{
    transform:scale(.92);
    opacity:.65;
  }
  .tab-icon{
    width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;
    border-radius:999px;
    border:1px solid transparent;
    transition:background .15s ease, border-color .15s ease, transform .15s ease;
  }
  .tab:active .tab-icon{
    transform:scale(.9);
    background:rgba(255,255,255,.16);
  }
  .tab-icon svg{width:17px;height:17px;}
  .tab-label{font-size:10px;letter-spacing:.01em;}
  .tab.active{color:var(--ink);}
  .tab.active .tab-icon{
    background:#fff;
    border-color:#fff;
  }
  .tab.active:active .tab-icon{background:rgba(255,255,255,.82);}
  .tab.active .tab-icon svg{stroke:#17152a;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
    .eyebrow,.title,.desc{opacity:1 !important;transform:none !important;}
    .tab:active{transform:none;opacity:.55;}
    .tab:active .tab-icon{transform:none;}
  }
</style>
