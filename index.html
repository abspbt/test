<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回春視務所 | ID PHOTO STUDIO</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1128">
<style>
  :root {
    --navy: #0a1128;
    --navy-deep: #060b1a;
    --gold: #d4af6a;
    --gold-dim: #a9863f;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--navy);
    background-image:
      linear-gradient(rgba(212, 175, 106, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(212, 175, 106, 0.05) 1px, transparent 1px);
    background-size: 32px 32px;
    color: var(--gold);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-weight: 200;
    display: flex;
    justify-content: center;
    padding: 64px 24px 48px;
  }

  .page {
    width: 100%;
    max-width: 460px;
    text-align: center;
  }

  .eyebrow {
    font-size: 14px;
    font-weight: 200;
    letter-spacing: 0.4em;
    color: var(--gold-dim);
  }

  .brand {
    margin-top: 28px;
    font-size: 64px;
    font-weight: 900;
    letter-spacing: 0.05em;
    color: var(--gold);
    text-shadow: 0 0 24px rgba(212, 175, 106, 0.25);
  }

  .divider-row {
    margin-top: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .divider-row .line {
    height: 1px;
    width: 40px;
    background: var(--gold-dim);
  }

  .subtitle {
    font-size: 17px;
    font-weight: 200;
    letter-spacing: 0.2em;
  }

  .tagline {
    margin-top: 14px;
    font-size: 15px;
    font-weight: 200;
    letter-spacing: 0.2em;
    color: var(--gold-dim);
  }

  .desc {
    margin-top: 32px;
    font-size: 17px;
    font-weight: 200;
    line-height: 1.9;
  }

  .location {
    margin-top: 28px;
    font-size: 15px;
    font-weight: 200;
    color: var(--gold-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .frame {
    margin: 56px auto 0;
    position: relative;
    width: 100%;
    max-width: 340px;
    aspect-ratio: 4 / 5;
  }

  .frame .corner {
    position: absolute;
    width: 28px;
    height: 28px;
    border-color: var(--gold);
  }

  .corner.tl { top: -6px; left: -6px; border-top: 2px solid; border-left: 2px solid; }
  .corner.tr { top: -6px; right: -6px; border-top: 2px solid; border-right: 2px solid; }
  .corner.bl { bottom: -6px; left: -6px; border-bottom: 2px solid; border-left: 2px solid; }
  .corner.br { bottom: -6px; right: -6px; border-bottom: 2px solid; border-right: 2px solid; }

  .photo {
    position: absolute;
    inset: 24px;
    background: rgba(212, 175, 106, 0.06);
    border: 1px solid rgba(212, 175, 106, 0.3);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 12%;
  }

  .photo .ratio-label {
    position: absolute;
    top: 20px;
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 0.3em;
    color: var(--gold-dim);
  }

  .photo .avatar-head {
    width: 34%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: var(--gold-dim);
    opacity: 0.5;
  }

  .photo .avatar-body {
    margin-top: 4%;
    width: 58%;
    aspect-ratio: 2 / 1;
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    background: var(--gold-dim);
    opacity: 0.5;
  }

  .actions {
    margin-top: 56px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .action {
    border: 1px dashed var(--gold);
    padding: 18px 20px;
    font-size: 16px;
    font-weight: 300;
    letter-spacing: 0.15em;
    color: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .action .ico {
    font-size: 15px;
    opacity: 0.85;
  }
</style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">ID PHOTO STUDIO</p>
    <h1 class="brand">回春視務所</h1>

    <div class="divider-row">
      <span class="line"></span>
      <p class="subtitle">高雄自然系質感證件照</p>
      <span class="line"></span>
    </div>
    <p class="tagline">現拍 · 現修 · 現取</p>

    <p class="desc">
      把最好的一張，留給重要的時刻。<br>
      平日、假日皆可預約。
    </p>

    <p class="location">
      <span class="ico">📍</span>
      高雄市前金區中山二路533號2樓之4
    </p>

    <div class="frame">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>
      <div class="photo">
        <span class="ratio-label">2 × 2 IN</span>
        <div class="avatar-head"></div>
        <div class="avatar-body"></div>
      </div>
    </div>

    <div class="actions">
      <div class="action"><span class="ico">🗓</span>預約檔期</div>
      <div class="action"><span class="ico">📷</span>Instagram 看拍攝效果</div>
      <div class="action"><span class="ico">📘</span>Facebook 聽老闆說垃圾話</div>
      <div class="action"><span class="ico">☆</span>Google 評價</div>
    </div>
  </main>
</body>
</html>
